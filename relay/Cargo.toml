[package]
name = "phosphor-relay"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Laptop-side half of the phosphor-mobil3 Tailscale bridge: streams the desktop's audio + player metadata to the phone and forwards transport commands to MPRIS."

[[bin]]
name = "phosphor-relay"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = "symbols"
